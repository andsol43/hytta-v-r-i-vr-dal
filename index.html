document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');
if(tab==='Hjem'){
el.innerHTML=`<h2>Velkommen til hytta 🌲</h2><div class="tiles">${tiles.map(([t,emoji,p])=>`<button class="tile" onclick="tab='${t}';render()">${p?`<img src="${localStorage.getItem('hytte_tile_'+p)||pictures[p]}" alt="${t}">`:`<div class="art">${emoji}</div>`}<strong>${emoji} ${t==='Fiske'?'Fiskekonkurranse':t}</strong></button>`).join('')}</div><div class="panel"><h3>Bytt bilder</h3><label>Hyttebilde<input type="file" accept="image/*" onchange="setPicture(this,'hero')"></label><label>Fiskekonkurranse<input type="file" accept="image/*" onchange="setPicture(this,'tile_fish')"></label><label>Minner<input type="file" accept="image/*" onchange="setPicture(this,'tile_memories')"></label><small>Du kan velge egne bilder senere. Bildene lagres på denne enheten.</small></div><div class="grid"><div class="panel"><b>🌡️ Inne</b><p>Sensor ikke tilkoblet</p></div><div class="panel"><b>☁️ Været ute</b><p id="weather">Henter…</p></div></div><div class="panel"><h3>Neste hyttebesøk</h3>${get('booking').filter(x=>x.end>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,3).map(x=>`<p>${esc(x.name)}: ${esc(x.start)} – ${esc(x.end)}</p>`).join('')||'Ingen planlagte besøk'}</div>`;
fetch('https://api.open-meteo.com/v1/forecast?latitude=59.33&longitude=8.49&current=temperature_2m,wind_speed_10m&timezone=Europe%2FOslo').then(r=>r.json()).then(d=>{let w=document.getElementById('weather');if(w)w.textContent=`${d.current.temperature_2m} °C · Vind ${d.current.wind_speed_10m} km/t`}).catch(()=>{let w=document.getElementById('weather');if(w)w.textContent='Ikke tilgjengelig uten nett'});
}
if(tab==='Kalender')el.innerHTML='<h2>📅 Hyttekalender</h2>'+fields('booking',[['name','Hvem skal på hytta?'],['start','Fra dato','date'],['end','Til dato','date']],'Legg inn besøk')+entries('booking',x=>`<b>${esc(x.name)}</b><p>${esc(x.start)} – ${esc(x.end)}</p>`);
if(tab==='Handleliste')el.innerHTML='<h2>🛒 Handleliste</h2>'+fields('shopping',[['item','Hva mangler?'],['qty','Antall / mengde']],'Legg til')+entries('shopping',x=>`<b>${esc(x.item)}</b> – ${esc(x.qty)}`);
if(tab==='Chat')el.innerHTML='<h2>💬 Hyttebeskjeder</h2>'+fields('chat',[['name','Navn'],['message','Beskjed']],'Lagre beskjed')+entries('chat',x=>`<b>${esc(x.name)}</b><p>${esc(x.message)}</p><small>${esc(x.date)}</small>`);
if(tab==='Minner')el.innerHTML='<h2>📸 Hytteminner</h2><img class="photo" src="'+pictures.memories+'" alt="Hytteminne"><div class="panel"><label>Legg til eget bilde<input id="photo" type="file" accept="image/*"></label><input id="caption" placeholder="Skriv om minnet"><button class="primary" onclick="photoAdd()">Lagre minne</button></div>'+entries('memories',x=>`<img class="photo" src="${x.image}" alt="Minne"><p>${esc(x.caption)}</p><small>${esc(x.date)}</small>`);
if(tab==='Fiske')el.innerHTML='<h2>🎣 Fiskekonkurranse</h2><img class="photo" src="'+pictures.fish+'" alt="Fangst fra hytta">'+fields('fish',[['name','Hvem fikk fisken?'],['species','Fiskeslag'],['length','Lengde i cm','number'],['weight','Vekt i kg','number']],'Registrer fangst')+'<h3>🏆 Største fisk (vekt)</h3>'+[...get('fish')].sort((a,b)=>Number(b.weight)-Number(a.weight)).map((x,i)=>`<div class="panel"><span class="score">${i+1}. ${esc(x.name)}</span><p>${esc(x.species)} · ${esc(x.length)} cm · ${esc(x.weight)} kg</p></div>`).join('');
if(tab==='Huskeliste')el.innerHTML='<h2>✅ Huskeliste</h2>'+fields('tasks',[['item','Hva må gjøres?']],'Legg til')+entries('tasks',x=>esc(x.item));
}
function compress(file,cb){let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,850/im.width,850/im.height);c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.65))};im.src=r.result};r.readAsDataURL(file)}
function setPicture(input,key){let f=input.files[0];if(f)compress(f,data=>{try{localStorage.setItem('hytte_'+key,data);render()}catch(e){alert('Bildet får ikke plass i lagringen')}})}
function photoAdd(){let f=document.getElementById('photo').files[0],caption=document.getElementById('caption').value;if(!f)return alert('Velg et bilde først');compress(f,image=>save('memories',[...get('memories'),{image,caption,date:new Date().toISOString().slice(0,10)}]))}
render();
</script></body></html>
