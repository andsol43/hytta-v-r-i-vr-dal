const tabs=['Hjem','Kalender','Handleliste','Chat','Minner','Fiske','Huskeliste'];let tab='Hjem';const get=(k)=>JSON.parse(localStorage.getItem('hytte_'+k)||'[]');const save=(k,v)=>{localStorage.setItem('hytte_'+k,JSON.stringify(v));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=document.getElementById('app');function add(k,fields){let x={date:new Date().toISOString().slice(0,10)};for(let f of fields){let v=document.getElementById(f).value.trim();if(!v)return alert('Fyll ut alle feltene');x[f]=v}save(k,[...get(k),x]);}function remove(k,i){save(k,get(k).filter((_,j)=>j!==i))}function form(k,fields,button){return `<div class="panel">${fields.map(([id,label,type])=>`<label>${label}<input id="${id}" type="${type||'text'}" ${type==='number'?'min="0" step="any"':''}></label>`).join('')}<button class="primary" onclick='add(${JSON.stringify(k)},${JSON.stringify(fields.map(x=>x[0]))})'>${button}</button></div>`}function items(k,fn){return get(k).map((x,i)=>`<div class="panel">${fn(x)} <button onclick="remove('${k}',${i})">Slett</button></div>`).join('')||'<p class="muted">Ingen registreringer ennå.</p>'}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');if(tab==='Hjem'){el.innerHTML='<h2>Velkommen til hytta 🌲</h2><div class="grid"><div class="panel"><b>🌡️ Inne</b><p>Ikke tilkoblet sensor</p></div><div class="panel"><b>☁️ Været i Vrådal</b><p id="weather">Henter...</p></div></div><div class="panel"><h3>Neste hyttebesøk</h3>'+([...get('booking')].sort((a,b)=>a.start.localeCompare(b.start)).filter(x=>x.end>=new Date().toISOString().slice(0,10)).slice(0,3).map(x=>`<p>${esc(x.name)}: ${esc(x.start)} – ${esc(x.end)}</p>`).join('')||'Ingen planlagt')+'</div>';fetch('https://api.open-meteo.com/v1/forecast?latitude=59.33&longitude=8.49&current=temperature_2m,wind_speed_10m&timezone=Europe%2FOslo').then(r=>r.json()).then(d=>document.getElementById('weather').textContent=`${d.current.temperature_2m} °C · Vind ${d.current.wind_speed_10m} km/t`).catch(()=>document.getElementById('weather').textContent='Været er utilgjengelig uten nett');}if(tab==='Kalender')el.innerHTML='<h2>📅 Hyttekalender</h2>'+form('booking',[['name','Hvem skal på hytta?'],['start','Fra dato','date'],['end','Til dato','date']],'Legg inn opphold')+items('booking',x=>`<b>${esc(x.name)}</b><p>${esc(x.start)} – ${esc(x.end)}</p>`);if(tab==='Handleliste')el.innerHTML='<h2>🛒 Handleliste</h2>'+form('shopping',[['item','Hva mangler?'],['qty','Antall / mengde']],'Legg til')+items('shopping',x=>`<b>${esc(x.item)}</b> – ${esc(x.qty)}`);if(tab==='Chat')el.innerHTML='<h2>💬 Hyttebeskjeder</h2>'+form('chat',[['name','Navn'],['message','Beskjed']],'Send beskjed')+items('chat',x=>`<b>${esc(x.name)}</b> <small>${x.date}</small><p>${esc(x.message)}</p>`);if(tab==='Minner')el.innerHTML='<h2>📷 Hytteminner</h2><div class="panel"><input id="photo" type="file" accept="image/*"><input id="caption" placeholder="Skriv et minne"><button class="primary" onclick="photoAdd()">Lagre minne</button></div>'+items('memories',x=>`<img class="memory" src="${x.image}" alt="Hytteminne"><p>${esc(x.caption)}</p><small>${x.date}</small>`);if(tab==='Fiske')el.innerHTML='<h2>🎣 Fiskekonkurranse</h2>'+form('fish',[['name','Fisker'],['species','Fiskeslag'],['length','Lengde i cm','number'],['weight','Vekt i kg','number']],'Registrer fangst')+'<h3>🏆 Rekorder (tyngst først)</h3>'+[...get('fish')].sort((a,b)=>Number(b.weight)-Number(a.weight)).map((x,i)=>`<div class="panel">${i+1}. <b>${esc(x.name)}</b> – ${esc(x.species)} · ${esc(x.length)} cm · ${esc(x.weight)} kg</div>`).join('');if(tab==='Huskeliste')el.innerHTML='<h2>✅ Huskeliste</h2>'+form('tasks',[['item','Oppgave']],'Legg til oppgave')+items('tasks',x=>esc(x.item));}function photoAdd(){const f=document.getElementById('photo').files[0],caption=document.getElementById('caption').value;if(!f)return alert('Velg et bilde');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/im.width);c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{save('memories',[...get('memories'),{image:c.toDataURL('image/jpeg',.65),caption,date:new Date().toISOString().slice(0,10)}])}catch(e){alert('Lagringsplassen er full. Prøv et mindre bilde.')}};im.src=reader.result};reader.readAsDataURL(f)}render();</script></body></html>
